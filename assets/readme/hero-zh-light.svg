    <text x="726" y="136" font-size="40" font-weight="700" letter-spacing="-1" fill="#1D1B26">27 h</text>
    <text x="814" y="136" font-size="20" fill="#6B6780">/ 28 小时</text>
    <rect x="902" y="72" width="210" height="34" rx="17" fill="#FCEBEC"/>
    <text x="1007" y="95" font-size="17" font-weight="600" text-anchor="middle" fill="#C93A40">+ 周五 18–20 → 29 小时</text>
