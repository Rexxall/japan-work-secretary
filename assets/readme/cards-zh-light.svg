<title id="t">Japan Work Secretary 能做什么</title>
<desc id="d">每个连续 7 天：某个连续 7 天会超 28 小时，保存前就提醒。按工资条算：深夜时薪、加班、实际休息都算上。排班进日历：读消息或照片，同步到日历。</desc>
