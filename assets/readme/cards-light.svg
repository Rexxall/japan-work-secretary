<title id="t">What Japan Work Secretary does</title>
<desc id="d">Every 7 days: a warning before a shift takes any 7-day window over 28 hours. Pay like a payslip: night rates, overtime and the breaks you actually took. Roster to calendar: read a message or a photo, then sync to Calendar.</desc>
