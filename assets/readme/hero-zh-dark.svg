<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Japan Work Secretary</title>
  <desc id="d">每周不超 28 小时。 工资按工资条的算法算。 本周已排 27 小时，上限 28。再加周五 18:00–20:00 一班就是 29 小时，保存前会标出来。</desc>
  <rect width="1200" height="400" rx="28" fill="#15141B"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif">
    <text x="64" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif" font-size="17" letter-spacing="1" fill="#A48BFF">OBSIDIAN 插件 · 在日留学生打工</text>
    <text x="62" y="196" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#EEECF5">Japan Work Secretary</text>
    <text x="64" y="252" font-size="29" fill="#EEECF5">每周不超 28 小时。</text>
    <text x="64" y="292" font-size="29" fill="#9C98AF">工资按工资条的算法算。</text>
    <text x="64" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif" font-size="17" fill="#9C98AF">免费 · 数据留在库里</text>
  </g>
  <g id="project-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif">
