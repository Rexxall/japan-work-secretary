name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against the versions and main
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "Tag $VERSION is not on main" >&2; exit 1; }
          node -e '
            const tag = process.env.VERSION;
            const manifest = require("./manifest.json");
            const lock = require("./package-lock.json");
            const found = {
              "manifest.json": manifest.version,
              "package.json": require("./package.json").version,
              "package-lock.json": lock.version,
              "package-lock.json root": lock.packages?.[""]?.version,
            };
            for (const [file, version] of Object.entries(found)) {
              if (version !== tag) throw new Error(`${file} says ${version}, tag is ${tag}`);
            }
            const minApp = require("./versions.json")[tag];
            if (minApp !== manifest.minAppVersion) throw new Error(`versions.json maps ${tag} to ${minApp}, manifest needs ${manifest.minAppVersion}`);
          '
          awk -v v="## $VERSION" '$0 == v { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Reject generated drift
        run: git diff --exit-code -- styles.css manifest.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$VERSION" main.js manifest.json styles.css --title "$VERSION" --notes-file release-notes.md --verify-tag
